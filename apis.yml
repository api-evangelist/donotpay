aid: donotpay
name: DoNotPay
description: >-
  DoNotPay is an AI-powered consumer advocacy platform, founded in 2015 by
  Joshua Browder and marketed as the "robot lawyer." It offers a web-based
  consumer product with 100+ AI-assisted tools that help people cancel
  subscriptions and free trials, dispute parking tickets and traffic
  violations, file chargebacks and refunds, negotiate and lower bills, find
  unclaimed money, fight robocalls, generate virtual cards for safe trial
  signups, and automate customer-service interactions. DoNotPay is a direct
  consumer application and does not publish a public developer API, SDK, or
  developer portal; it is tracked here as an API Evangelist company profile.
